name: linzaivision_primary
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  intl: ^0.20.2
  flutter_zoom_drawer: ^3.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  sqflite_common_ffi: ^2.3.2+1
  flutter_slidable: ^4.0.0
  #image_gallery_saver: ^2.0.3
  # 阿里云一键登录SDK - 已移除，仅使用验证码登录
  # flutter_ali_auth:
  #   path: ./plugins/flutter_ali_auth
  # 持久化存储用户登录信息
  shared_preferences: ^2.2.2
  # 用于打开外部链接
  url_launcher: ^6.2.4
  flutter_native_splash: ^2.4.0
  video_player: ^2.10.0
  # 视频缩略图生成
  video_thumbnail: ^0.5.3
  # media_scanner_scan_file: ^0.0.3
  
  # 状态管理
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_secure_storage: ^4.2.1
  rxdart: ^0.27.7

  # 网络请求
  http: ^1.1.0

  # 应用信息
  package_info_plus: ^8.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/default.jpg
    - assets/images/
    - assets/images/default/
    - assets/icons/
    - assets/icons/chenggong.png
    - assets/icons/feiqi.png
    - assets/images/app_logo.png
    - assets/images/applogo/
  fonts:
    - family: Abhaya Libre ExtraBold
      fonts:
        - asset: assets/fonts/AbhayaLibre-ExtraBold.ttf
          weight: 800
    - family: STZhongsong
      fonts:
        - asset: assets/fonts/STZhongsong.ttf
          weight: 800
